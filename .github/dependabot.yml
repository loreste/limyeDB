version: 2

# Every manifest in the repo needs an entry here. Security updates flow for
# anything in the dependency graph, but version updates only run for the
# ecosystems declared below -- the client SDKs previously got none.
# Groups keep this from becoming one PR per module: without grouping each Go
# bump opened its own PR and rebased go.sum against the others, conflicting
# serially.
updates:
  # --- server (root module) ---
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
      go-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # --- client SDKs: monthly to keep the PR volume down ---
  - package-ecosystem: "gomod"
    directory: "/clients/go"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-go:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/clients/javascript"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-javascript:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/clients/typescript/limyedb"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-typescript:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/clients/python"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-python:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/clients/rust"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-rust:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/clients/java"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-java:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/clients/csharp"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 3
    groups:
      clients-csharp:
        patterns:
          - "*"
